<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Mini Looper</title>
  <!-- ✅ Viewport for responsive scaling -->
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- ✅ Inter font -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;200;400;600&display=swap" rel="stylesheet">

  <style>
    /* ─── Responsive Sizing Variables ───────────────────────────── */
    :root {
      --pad: clamp(60px, 20vw, 120px);
      --gap: clamp(9px, 2vw, 18px);
      --panel-max: 620px;
    }

    html, body {
      background: transparent !important;
    }

    body, button, div {
      margin: 0;
      padding: 0;
      font-family: 'Inter', 'Futura', 'Arial', sans-serif;
      color: #fff;
    }


    .main-bg-container {
      background: #181c20;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 5vh 1vw;
      border-radius: 18px;
      box-shadow: 0 4px 32px #000a;
    }
    
    /* ─── Button Panel ─────────────────────────────────────────── */
    #panel {
      display: grid;
      grid-template-rows: repeat(auto-fit, minmax(var(--pad), 1fr));
      gap: var(--gap);
      max-width: var(--panel-max);
      width: 100%;
      /*
      margin: 0 auto;
      padding: clamp(12px, 4vw, 30px);
      */
    }

    .group-row {
      /*display: contents; /* Let grid handle placement */
      display: flex;
      align-items: center;
      justify-content: center;
      /* gap: 5px; */
      gap: var(--gap);
    }

    /* ─── Drum Pad Buttons ─────────────────────────────────────── */
    @property --gradient-angle {
      syntax: '<angle>';
      initial-value: 0deg;
      inherits: false;
    }

    .toggle {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: var(--pad);
      height: var(--pad);
      background: #232323;
      border: 2px solid #F2A03D;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.3s, transform 0.12s cubic-bezier(.4,2,.6,1), box-shadow 0.18s;
      box-shadow: 0 2px 8px #0008;
      position: relative;
      z-index: 1;
    }

    .toggle span {
      pointer-events: none;
      font-size: clamp(1px, 4vw, 23px);
    }

    .toggle .icon {
      margin-top: 12px;
      font-size: clamp(18px, 7vw, 26px);
      line-height: 1;
    }

    .toggle:not(:disabled):not(.selected):not(.variation-selected):hover {
      background: #2d2d2d;
    }

    .toggle:disabled {
      background: #333;
      border-color: #555;
      color: #777;
      opacity: 1;
      cursor: default;
    }

    .toggle.variation-enabled:disabled,
    .toggle.variation-selected:disabled {
      background: #bbb;
      border-color: #ddd;
      color: #888;
    }

    .toggle.selected {
      background: #F2A03D;
      color: #000;
      border-color: #F2A03D;
      box-shadow: 0 0 8px rgba(242, 160, 61, 0.7);
    }

    .toggle.variation-selected {
      background: #0F2D2C;
      color: #F2A03D;
      border-color: #D95F43;
      box-shadow: 0 0 6px rgba(217, 94, 67, 0.6);
    }

    .toggle.variation-enabled:not(.variation-selected):not(:disabled) {
      background: #232323;
      color: #fff;
      border-color: #D95F43;
      box-shadow: 0 0 8px 2px #d95f4344;
    }

    .toggle:not(:disabled):active {
      transform: scale(0.96);
      box-shadow: 0 1px 2px #0006;
    }

    /* ─── Glow Effect ───────────────────────────────────────────── */
    .pad-wrapper {
      position: relative;
      display: inline-block;
      width: var(--pad);
      height: var(--pad);
      vertical-align: middle;
    }

    .glow-square {
      position: absolute;
      top: 50%;
      left: 50%;
      width: var(--pad);
      height: var(--pad);
      transform: translate(-50%, -50%);
      border-radius: 12px;
      z-index: 0;
      background: conic-gradient(
        from var(--gradient-angle),
        #F2A03D, #FF6A00, #D95F43, #FF3C00, #F2A03D
      );
      animation: rotation 2.5s linear infinite;
      filter: blur(0.4rem);
      opacity: 0.85;
      pointer-events: none;
    }

    @keyframes rotation {
      0% { --gradient-angle: 0deg; }
      100% { --gradient-angle: 360deg; }
    }

    /* Optional: reduce glow blur on very small screens */
    @media (max-width: 480px) {
      .glow-square {
        filter: blur(0.28rem);
      }
    }

    /* ─── Stop All Button ───────────────────────────────────────── */
    #masterRow {
      margin-top: clamp(8px, 20%, 22px);
      display: flex;
      justify-content: center;
    }

    #killAll {
      border-radius: 8px;
      background: #D95F43;
      border: 2px solid #D95F43;
      color: #fff;
      font-family: 'Inter', 'Futura', 'Arial', sans-serif;
      cursor: pointer;
      transition: background 0.3s, color 0.2s;
      box-shadow: 0 2px 8px #0008;

      padding-top: 5%;
      padding-bottom: 5%;
      font-size: clamp(1px, 4vw, 23px);
      width: clamp(80px, 25vw, 150px);
    }

    #killAll:hover {
      background: #e86a50;
      color: #fff;
    }

    .col-separator {
      width: 0;
      /* height: 84px; */
      height: var(--pad);
      border-left: 2.5px solid;
      border-image: linear-gradient(to bottom, #F2A03D, #D95F43) 1;
      margin: 0 1vw;
      opacity: 0.7;
      box-shadow: 0 0 6px #F2A03D44;
      align-self: center;
    }
  </style>
</head>
<body>
  <div class="main-bg-container">
    <!-- BUTTON PANEL -->
    <div id="panel"></div>

    <!-- STOP ALL CONTROL -->
    <div id="masterRow">
      <button id="killAll">Stop All</button>
    </div>
  </div>

  <!-- Your looper script -->
  <script src="https://cdn.jsdelivr.net/npm/tone@14.8.49/build/Tone.min.js"></script>
  <script src="looper.js"></script>
</body>
</html>
